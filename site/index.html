<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encore Slides</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            coral: { DEFAULT: '#B5303B', light: '#d4777e' },
            anthracite: '#2d2d2d',
            paper: '#faf8f5',
          },
          fontFamily: {
            serif: ['"New Computer Modern"', '"Computer Modern Serif"', 'Georgia', 'serif'],
          },
        },
      },
    }
  </script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/fonts.css');

<body class="bg-paper text-anthracite font-serif antialiased">

  <div class="max-w-3xl mx-auto px-6 py-16">

      <h1 class="text-4xl font-bold tracking-tight mb-2">Encore Slides</h1>
      <p class="text-lg text-gray-500">Talks built with the encore-slides Typst template</p>

    <!-- Slides -->
    <section class="mb-14">
      <h2 class="text-2xl font-bold border-b-2 border-coral pb-1 mb-6">Slides</h2>
      <ul class="space-y-1">
        <li class="flex justify-between items-baseline">
          <a href="encore-slides.pdf" class="hover:text-coral transition-colors">Encore Slides — template tour</a>
          <span class="text-xs text-gray-400 ml-2 shrink-0">PDF</span>
        </li>
      </ul>
    </section>

    <!-- Links -->
    <section class="mb-14">
      <h2 class="text-2xl font-bold border-b-2 border-coral pb-1 mb-6">Links</h2>
      <ul class="space-y-1">
        <li class="flex justify-between items-baseline">
          <a href="https://github.com/vbergeron/encore-slides" class="hover:text-coral transition-colors">encore-slides — this site's source</a>

        </li>
        <li class="flex justify-between items-baseline">
          <a href="https://github.com/vbergeron/encore" class="hover:text-coral transition-colors">encore</a>
          <span class="text-xs text-gray-400 ml-2 shrink-0">GitHub</span>

        <li class="flex justify-between items-baseline">
          <a href="https://github.com/vbergeron/encore-benchmarks" class="hover:text-coral transition-colors">encore-benchmarks</a>
          <span class="text-xs text-gray-400 ml-2 shrink-0">GitHub</span>
        </li>
      </ul>
    </section>

    <!-- Footer -->
    <footer class="text-center text-sm text-gray-400 border-t border-gray-200 pt-6">
      <p>Encore Slides &mdash; Typst slide template</p>
      <p class="mt-1">
        <a href="https://github.com/vbergeron/encore-slides" class="hover:text-coral transition-colors">Source on GitHub</a>
      </p>
    </footer>

  </div>

</body>
</html>
