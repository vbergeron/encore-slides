name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Compile all decks
        run: mise run build-all
      - name: Build the CUE playground
        run: mise run playground
      - uses: actions/upload-artifact@v4
        with:
          name: decks
          path: site/decks/*.pdf

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: compile
    runs-on: ubuntu-latest
    # Pages rejects a deployment while another is in progress, so serialize
    # deploys; a newer pending run supersedes an older pending one.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Compile decks into the site
        run: mise run build-all
      - name: Build the CUE playground
        run: mise run playground
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
